# Rose Pine colors matching the previous swaylock-effects configuration.
general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = linear, 0, 0, 1, 1
    animation = fadeIn, 1, 2, linear
    animation = fadeOut, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    color = rgb(1f1d2e)
    blur_passes = 3
    blur_size = 9
}

input-field {
    monitor =
    size = 320, 64
    outline_thickness = 3
    inner_color = rgb(1f1d2e)
    outer_color = rgb(9ccfd8)
    check_color = rgb(eb6f92)
    fail_color = rgb(31748f)
    font_color = rgb(e0def4)
    font_family = Roboto
    placeholder_text = Пароль
    fail_text = Не удалось разблокировать
    capslock_color = rgb(eb6f92)
    fade_on_empty = false
    rounding = 16
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgb(e0def4)
    font_size = 80
    font_family = Roboto
    position = 0, 130
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%a, %e %B"
    color = rgb(e0def4)
    font_size = 22
    font_family = Roboto
    position = 0, 50
    halign = center
    valign = center
}

label {
    monitor =
    text = $LAYOUT[en,ru]
    color = rgb(e0def4)
    font_size = 16
    font_family = Roboto
    position = 0, -150
    halign = center
    valign = center
}
